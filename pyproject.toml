[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symvion"
version = "0.4.11"
description = "Multi-tenant AI orchestration framework powered by LangGraph."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.45",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "click>=8.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "cryptography>=50.0.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "PyJWT>=2.13.0",
]

[project.scripts]
symvion = "symvion.cli:main"
create-symvion = "symvion.cli:create_symvion"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
